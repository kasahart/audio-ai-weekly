name: GitHub Models probe
on:
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openai
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import os,json
          from openai import OpenAI
          client=OpenAI(api_key=os.environ['GITHUB_TOKEN'],base_url='https://models.github.ai/inference',max_retries=0,timeout=60)
          try:
              raw=client.chat.completions.with_raw_response.create(model='openai/gpt-4.1',messages=[{'role':'user','content':'Return JSON with status ok.'}],response_format={'type':'json_object'},max_tokens=100)
              parsed=raw.parse()
              result={'status':raw.status_code,'content_type':raw.headers.get('content-type'),'parsed_type':type(parsed).__name__}
              try:
                  data=json.loads(raw.text)
                  result['json_object']=isinstance(data,dict)
                  result['has_choices']=isinstance(data,dict) and bool(data.get('choices'))
              except Exception:
                  result['json_object']=False
              print('PROBE_RESULT '+json.dumps(result))
          except Exception as exc:
              print('PROBE_RESULT '+json.dumps({'error_type':type(exc).__name__,'status':getattr(exc,'status_code',None)}))
          PYCODE
