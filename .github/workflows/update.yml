name: Gemma 4 31B connectivity probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openai
      - name: Probe Gemini without logging credentials or response bodies
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PYCODE'
          import os, json
          from openai import OpenAI, APIStatusError
          client = OpenAI(api_key=os.environ['GEMINI_API_KEY'], base_url='https://generativelanguage.googleapis.com/v1beta/openai/', max_retries=0, timeout=90)
          try:
              response = client.chat.completions.create(model='gemma-4-31b-it', messages=[{'role':'user','content':'Return a JSON object with status equal to ok.'}], max_tokens=1024)
              valid = json.loads(response.choices[0].message.content).get('status') == 'ok'
              print(json.dumps({'model':'gemma-4-31b-it','request_succeeded':True,'json_valid':valid,'finish_reason':response.choices[0].finish_reason}))
              if not valid: raise SystemExit(1)
          except APIStatusError as exc:
              print(json.dumps({'model':'gemma-4-31b-it','request_succeeded':False,'http_status':exc.status_code}))
              raise SystemExit(1)
          except Exception as exc:
              print(json.dumps({'request_succeeded':False,'error_type':type(exc).__name__}))
              raise SystemExit(1)
          PYCODE
